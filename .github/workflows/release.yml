name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tag and build
        run: |
          expected="v$(grep '^version = ' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')"
          test "$GITHUB_REF_NAME" = "$expected"
          ./gradlew clean test build
      - name: Prepare release files
        run: |
          mkdir release
          cp build/libs/AllyRadar-*.jar release/
          sha256sum release/*.jar > release/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "AllyRadar ${GITHUB_REF_NAME#v}" \
            --generate-notes

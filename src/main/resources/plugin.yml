name: AllyRadar
version: '${version}'
main: dev.allyradar.AllyRadar
api-version: '26.3'
authors: [Naboraj Sarkar]
softdepend: [ProtocolLib]
description: Privacy-preserving team management and teammate radar for Paper.
commands:
  ally:
    description: Manage AllyRadar teams and radar.
    usage: /ally [help|create|invite|accept|deny|leave|list|info|status|hud|radius]
    aliases: [allyradar, ar, a]
  a:
    description: Quick shorthand for /ally (perfect for Bedrock touch & controller players).
    usage: /a [on|off|hud|radius|public|private|accept|leave|status|bedrock]
  team:
    description: Manage your AllyRadar team.
    usage: /team <create|invite|accept|deny|leave|kick|transfer|info|list|disband|settings>
  radar:
    description: Configure your AllyRadar receiver and sharing preferences.
    usage: /radar [on|off|visibility|status|who]
permissions:
  allyradar.use:
    default: true
  allyradar.admin:
    default: op
